services:
    backend-php:
        image:    ghcr.io/yohang/unlockey/backend-php:${DOCKER_TAG-latest}
        networks: [ unlockey-backend ]
        depends_on: [ backend-database, mercure ]
        restart: unless-stopped
        environment:
            SERVER_NAME: ${SERVER_NAME:-localhost}
            # Publish straight to the hub container, subscribers go through the Caddy proxy (/.well-known/mercure)
            MERCURE_URL: ${CADDY_MERCURE_URL:-http://mercure/.well-known/mercure}
            MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
            MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            MERCURE_ISSUER: ${MERCURE_ISSUER:-https://localhost}
        build:
            context: .
            target: app
            args:
                EXTERNAL_USER_ID: ${EXTERNAL_USER_ID-1000}
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        ports:
            # HTTP
            -   target: 80
                published: ${HTTP_PORT:-80}
                protocol: tcp
            # HTTPS
            -   target: 443
                published: ${HTTPS_PORT:-443}
                protocol: tcp
            # HTTP/3
            -   target: 443
                published: ${HTTP3_PORT:-443}
                protocol: udp


    mercure:
        image:    dunglas/mercure:v1.0.0-beta.1
        networks: [ unlockey-backend ]
        restart: unless-stopped
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            # Protocol 1.0: tokens are OAuth 2.0 access tokens, their "iss" must match this trusted issuer id
            MERCURE_TRUSTED_ISSUERS: ${MERCURE_ISSUER:-https://localhost}
            # Behind the proxy each client sees a different host: pin the resource identifier (token "aud")
            MERCURE_EXTRA_DIRECTIVES: resource_identifier ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
        volumes:
            - mercure_data:/data
            - mercure_config:/config

    backend-database:
        image:   postgres:18-trixie
        volumes: [ 'database-data:/var/lib/postgresql' ]
        networks: [ unlockey-backend ]
        environment:
            - POSTGRES_DB=unlockey
            - POSTGRES_USER=unlockey
            - POSTGRES_PASSWORD=unlockey

volumes:
    database-data: ~
    caddy_data: ~
    caddy_config: ~
    mercure_data: ~
    mercure_config: ~

networks:
    unlockey-backend: ~
