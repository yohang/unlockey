# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Finite\StateMachine: ~

    # Adds the reachable Finite transitions to the JSON-LD representation of a Locker
    App\Serializer\LockerTransitionsNormalizer:
        decorates: api_platform.jsonld.normalizer.item

    # Documents that "transitions" key in the Locker JSON Schema / OpenAPI
    App\JsonSchema\LockerSchemaFactory:
        decorates: api_platform.json_schema.schema_factory
    Finite\Extension\Twig\FiniteExtension: ~
    Finite\Event\EventDispatcher:
        calls:
            -
                method: addEventListener
                arguments:
                    - 'Finite\Event\CanTransitionEvent'
                    - ['@App\Workflow\EventListener\OccupationStateTransitionListener', onCanTransition]

when@test:
    services:
        # No network in tests: swap the real hub for a MockHub whose publisher is a no-op.
        # MercureBundle still decorates it with TraceableHub (kernel.debug), so published
        # updates are visible in the profiler's "mercure" data collector.
        App\Tests\Mercure\NullPublisher: ~
        mercure.hub.default:
            class: Symfony\Component\Mercure\MockHub
            arguments:
                $url: '%env(MERCURE_URL)%'
                $jwtProvider: '@mercure.hub.default.jwt.provider'
                $publisher: !closure '@App\Tests\Mercure\NullPublisher'
                # Factory decorated with the protocol 1.0 default claims (iss, aud, sub, client_id)
                $jwtFactory: '@mercure.hub.default.jwt.factory.default_claims'
                $publicUrl: '%env(MERCURE_PUBLIC_URL)%'
                $protocolVersion: !php/enum Symfony\Component\Mercure\ProtocolVersion::V1
