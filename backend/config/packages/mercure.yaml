mercure:
    hubs:
        default:
            url: '%env(MERCURE_URL)%'
            public_url: '%env(MERCURE_PUBLIC_URL)%'
            protocol_version: '1.0'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: ['*']
                # RFC 9068 claims required by protocol 1.0 ("aud" defaults to public_url)
                claims:
                    iss: '%env(MERCURE_ISSUER)%'
                    sub: unlockey-backend
                    client_id: unlockey-backend
