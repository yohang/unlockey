<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>unlockey – client API</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22><text y=%221.2em%22 font-size=%2296%22>🔐</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        .state-badge { font-size: 1rem; }
        .locker-card { cursor: pointer; }
        .locker-card:hover { box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .15); }
        #qr-dialog { border: 0; border-radius: .5rem; padding: 0; width: min(95vw, 32rem); }
        #qr-dialog::backdrop { background: rgba(0, 0, 0, .6); }
        #qr-reader { width: 100%; }
        #qr-reader video { width: 100%; border-radius: .5rem; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand py-0" href="#/">unlockey</a>
            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="#/">Casiers</a></li>
                <li class="nav-item"><a class="nav-link" href="/api" target="_blank" rel="noopener">API</a></li>
            </ul>
        </div>
    </nav>

    <main class="container pb-5">
        <div id="alerts"></div>

        <section class="card mb-4">
            <div class="card-body">
                <h2 class="h5 card-title">Trouver un casier</h2>
                <form id="search-form" class="row g-2 align-items-end">
                    <div class="col-12 col-sm">
                        <label for="search-code" class="form-label">Code du casier</label>
                        <input id="search-code" class="form-control" type="text" placeholder="chips-1" autocomplete="off" required>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary" type="submit">Ouvrir la fiche</button>
                    </div>
                    <div class="col-auto">
                        <button id="qr-button" class="btn btn-outline-secondary" type="button">Scannez le QR Code</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="view"></section>
    </main>

    <dialog id="qr-dialog">
        <div class="p-3">
            <h2 class="h5 mb-3">Scannez le QRCode sur le casier</h2>
            <div id="qr-reader" class="mb-3">Chargement…</div>
            <div class="text-end">
                <button id="qr-close" class="btn btn-secondary" type="button">Fermer</button>
            </div>
        </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" crossorigin="anonymous"></script>
    <script>
        'use strict';

        // ---------------------------------------------------------------- API client

        const API_BASE = '/api';

        class ApiError extends Error {
            constructor(status, body) {
                super((body && (body.description || body.detail || body.title)) || `Erreur HTTP ${status}`);
                this.status = status;
                this.body = body;
            }
        }

        async function api(method, path) {
            let response;
            try {
                response = await fetch(API_BASE + path, {
                    method,
                    headers: { 'Accept': 'application/ld+json' },
                });
            } catch (error) {
                throw new ApiError(0, { description: 'Impossible de joindre le serveur.' });
            }

            const body = response.status === 204 ? null : await response.json().catch(() => null);
            if (!response.ok) {
                throw new ApiError(response.status, body);
            }

            return body;
        }

        const lockersApi = {
            list: () => api('GET', '/lockers'),
            get: (code) => api('GET', `/lockers/${encodeURIComponent(code)}`),
            transition: (code, transition) => api('POST', `/lockers/${encodeURIComponent(code)}/${encodeURIComponent(transition)}`),
        };

        // ---------------------------------------------------------------- Labels

        const STATE_LABELS = { open: 'Ouvert', closed: 'Fermé' };
        const STATE_COLORS = { open: 'success', closed: 'danger' };
        const TRANSITION_LABELS = { open: 'Ouvrir', close: 'Fermer' };
        const TRANSITION_COLORS = { open: 'success', close: 'danger' };

        const stateLabel = (state) => STATE_LABELS[state] || state;
        const stateColor = (state) => STATE_COLORS[state] || 'secondary';

        // ---------------------------------------------------------------- Rendering helpers

        const view = document.getElementById('view');
        const alerts = document.getElementById('alerts');

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function showAlert(message, type = 'danger') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.setAttribute('role', 'alert');
            alert.innerHTML = `${escapeHtml(message)}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>`;
            alerts.replaceChildren(alert);
        }

        function clearAlerts() {
            alerts.replaceChildren();
        }

        function renderLoading(text = 'Chargement…') {
            view.innerHTML = `
                <div class="d-flex align-items-center gap-2 text-secondary">
                    <div class="spinner-border spinner-border-sm" role="status"></div>
                    <span>${escapeHtml(text)}</span>
                </div>`;
        }

        function handleError(error, context = {}) {
            if (error instanceof ApiError) {
                if (error.status === 404) {
                    showAlert(context.code ? `Casier « ${context.code} » introuvable.` : 'Casier introuvable.');
                    return;
                }
                if (error.status === 409) {
                    showAlert("Transition impossible : le casier a peut-être déjà changé d'état.", 'warning');
                    return;
                }
                showAlert(error.message);
                return;
            }

            console.error(error);
            showAlert('Une erreur inattendue est survenue.');
        }

        // ---------------------------------------------------------------- Views

        async function renderList() {
            renderLoading('Chargement des casiers…');

            let collection;
            try {
                collection = await lockersApi.list();
            } catch (error) {
                view.innerHTML = '';
                handleError(error);
                return;
            }

            const lockers = collection.member || [];
            if (lockers.length === 0) {
                view.innerHTML = '<p class="text-secondary">Aucun casier.</p>';
                return;
            }

            view.innerHTML = `
                <h1 class="h4 mb-3">Casiers <span class="badge text-bg-secondary">${lockers.length}</span></h1>
                <div class="row g-3">
                    ${lockers.map((locker) => `
                        <div class="col-12 col-sm-6 col-lg-4">
                            <a class="card locker-card h-100 text-decoration-none text-body" href="#/locker/${encodeURIComponent(locker.code)}">
                                <div class="card-body d-flex justify-content-between align-items-start gap-2">
                                    <div>
                                        <h2 class="h6 card-title mb-1">${escapeHtml(locker.name)}</h2>
                                        <code>${escapeHtml(locker.code)}</code>
                                    </div>
                                    <span class="badge text-bg-${stateColor(locker.state)} state-badge">${escapeHtml(stateLabel(locker.state))}</span>
                                </div>
                            </a>
                        </div>`).join('')}
                </div>`;
        }

        function renderLocker(locker) {
            const transitions = Array.isArray(locker.transitions) ? locker.transitions : [];

            view.innerHTML = `
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#/">Casiers</a></li>
                        <li class="breadcrumb-item active" aria-current="page">${escapeHtml(locker.code)}</li>
                    </ol>
                </nav>
                <div class="card">
                    <div class="card-body text-center">
                        <h1 class="h3 card-title">${escapeHtml(locker.name)}</h1>
                        <p class="text-secondary mb-4"><code>${escapeHtml(locker.code)}</code> · <a href="${escapeHtml(API_BASE + '/lockers/' + encodeURIComponent(locker.code))}" target="_blank" rel="noopener">JSON-LD</a></p>
                        <p class="fs-5 my-4">
                            Le casier est actuellement
                            <span class="badge text-bg-${stateColor(locker.state)} state-badge">${escapeHtml(stateLabel(locker.state))}</span>
                        </p>
                        <div class="d-flex flex-wrap justify-content-center gap-2" id="transitions">
                            ${transitions.map((transition) => `
                                <button class="btn btn-lg btn-${TRANSITION_COLORS[transition] || 'primary'}" type="button" data-transition="${escapeHtml(transition)}">
                                    ${escapeHtml(TRANSITION_LABELS[transition] || transition)}
                                </button>`).join('')}
                            <button class="btn btn-lg btn-outline-secondary" type="button" data-refresh>Actualiser</button>
                        </div>
                    </div>
                </div>`;

            view.querySelectorAll('[data-transition]').forEach((button) => {
                button.addEventListener('click', () => applyTransition(locker.code, button.dataset.transition));
            });
            view.querySelector('[data-refresh]').addEventListener('click', () => renderDetail(locker.code));
        }

        async function renderDetail(code) {
            renderLoading(`Chargement du casier ${code}…`);

            try {
                renderLocker(await lockersApi.get(code));
            } catch (error) {
                view.innerHTML = '<p><a href="#/">← Retour à la liste</a></p>';
                handleError(error, { code });
            }
        }

        async function applyTransition(code, transition) {
            clearAlerts();
            view.querySelectorAll('#transitions button').forEach((button) => { button.disabled = true; });

            try {
                const locker = await lockersApi.transition(code, transition);
                renderLocker(locker);
                showAlert(`${locker.name} : ${stateLabel(locker.state).toLowerCase()}.`, 'success');
            } catch (error) {
                handleError(error, { code });
                // State may have changed behind our back: reload it.
                if (error instanceof ApiError && error.status === 409) {
                    await renderDetail(code);
                } else {
                    view.querySelectorAll('#transitions button').forEach((button) => { button.disabled = false; });
                }
            }
        }

        // ---------------------------------------------------------------- Routing (hash based)

        function route() {
            clearAlerts();

            const hash = window.location.hash || '#/';
            const match = hash.match(/^#\/locker\/([^/]+)\/?$/);
            if (match) {
                renderDetail(decodeURIComponent(match[1]));
                return;
            }

            renderList();
        }

        function goToLocker(code) {
            window.location.hash = `#/locker/${encodeURIComponent(code.trim())}`;
        }

        window.addEventListener('hashchange', route);

        // ---------------------------------------------------------------- Search

        document.getElementById('search-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const input = document.getElementById('search-code');
            if (input.value.trim()) {
                goToLocker(input.value);
                input.value = '';
            }
        });

        // ---------------------------------------------------------------- QR code scan

        const qrDialog = document.getElementById('qr-dialog');
        const qrReaderId = 'qr-reader';
        let qrScanner = null;

        // Accepts the URL printed on the lockers (…/app/locker/{code}), an API IRI (…/api/lockers/{code}) or a bare code.
        function extractCode(text) {
            const fromUrl = text.match(/\/(?:app\/locker|api\/lockers)\/([-\w]+)\/?$/i);
            if (fromUrl) {
                return fromUrl[1];
            }

            return /^[-\w]+$/.test(text.trim()) ? text.trim() : null;
        }

        async function stopScanner() {
            if (qrScanner) {
                try {
                    await qrScanner.stop();
                    qrScanner.clear();
                } catch (error) {
                    // Scanner may already be stopped.
                }
                qrScanner = null;
            }
        }

        async function closeQrDialog() {
            await stopScanner();
            qrDialog.close();
        }

        document.getElementById('qr-button').addEventListener('click', async () => {
            if (typeof Html5Qrcode === 'undefined') {
                showAlert("Le lecteur de QR code n'a pas pu être chargé.");
                return;
            }

            qrDialog.showModal();
            document.getElementById(qrReaderId).textContent = 'Chargement…';

            let devices;
            try {
                devices = await Html5Qrcode.getCameras();
            } catch (error) {
                document.getElementById(qrReaderId).textContent = 'Accès à la caméra refusé ou indisponible.';
                return;
            }

            if (!devices.length) {
                document.getElementById(qrReaderId).textContent = 'Aucune caméra détectée.';
                return;
            }

            document.getElementById(qrReaderId).textContent = '';
            qrScanner = new Html5Qrcode(qrReaderId);

            try {
                await qrScanner.start(
                    devices[0].id,
                    {
                        fps: 10,
                        qrbox: Math.round(Math.min(window.innerWidth, 512) * 0.5),
                        videoConstraints: { facingMode: 'environment' },
                    },
                    async (decodedText) => {
                        const code = extractCode(decodedText);
                        if (!code) {
                            return;
                        }

                        await closeQrDialog();
                        goToLocker(code);
                    },
                    () => {},
                );
            } catch (error) {
                document.getElementById(qrReaderId).textContent = 'Impossible de démarrer la caméra.';
            }
        });

        document.getElementById('qr-close').addEventListener('click', closeQrDialog);
        qrDialog.addEventListener('close', stopScanner);

        // ---------------------------------------------------------------- Boot

        route();
    </script>
</body>
</html>
